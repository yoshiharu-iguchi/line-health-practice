<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LINE体調報告アプリ（練習用）</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <h1>LINE体調報告アプリ</h1>
      <p>実在の学生情報を使わない、学習用の試作画面です。</p>
      <p class="notice">実在する氏名、連絡先、体調情報は入力しないでください。練習用の選択肢だけを使います。</p>

      <section class="card" aria-labelledby="student-title">
        <h2 id="student-title">学生用：体調を報告する</h2>
        <p>練習用の選択肢を選び、送信前の内容を確認します。</p>

        <form id="health-report-form">
          <label for="condition">体調</label>
          <select id="condition" name="condition">
            <option value="良好">良好</option>
            <option value="普通">普通</option>
            <option value="不良">不良</option>
          </select>

          <label for="attendance">予定への参加</label>
          <select id="attendance" name="attendance">
            <option value="参加できる">参加できる</option>
            <option value="相談したい">相談したい</option>
            <option value="参加が難しい">参加が難しい</option>
          </select>

          <label for="contact-request">教員からの連絡希望</label>
          <select id="contact-request" name="contact-request">
            <option value="不要">不要</option>
            <option value="希望する">希望する</option>
          </select>

          <button type="submit">選択内容を確認する</button>
        </form>

        <section id="confirmation" class="confirmation" hidden aria-live="polite">
          <h3>選択内容の確認</h3>
          <p>体調：<span id="result-condition"></span></p>
          <p>予定への参加：<span id="result-attendance"></span></p>
          <p>教員からの連絡希望：<span id="result-contact-request"></span></p>
          <button id="add-to-list-button" type="button">この内容を一覧へ追加する</button>
          <p>この段階では、内容は保存・送信されません。</p>
        </section>
      </section>

      <section class="card" aria-labelledby="teacher-title">
        <h2 id="teacher-title">教員用：報告を確認する</h2>
        <p>ページを開いている間だけ、匿名の練習用データを表示します。</p>
        <section class="summary" aria-label="報告の集計">
          <p>全ての報告数：<strong id="total-count">0</strong></p>
          <p>未対応の報告数：<strong id="pending-count">0</strong></p>
          <p>対応済みの報告数：<strong id="completed-count">0</strong></p>
        </section>
        <div class="filter-buttons" aria-label="対応状態で絞り込む">
          <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">全て表示</button>
          <button class="filter-button" type="button" data-filter="未対応" aria-pressed="false">未対応のみ</button>
          <button class="filter-button" type="button" data-filter="対応済み" aria-pressed="false">対応済みのみ</button>
        </div>
        <button id="reset-button" class="reset-button" type="button">練習用データをすべて初期化する</button>
        <p id="empty-list-message">まだ追加された練習用の報告はありません。</p>
        <ul id="report-list" aria-live="polite"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
